[tool.black]
line-length = 100
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.tox
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["app", "services", "models", "utils"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "alembic/versions",          # autogenerated migrations: no lint gate
    "app/services/variant_data", # large generated data dump
]

[tool.ruff.lint]
# Conservative baseline — expand once it holds.
# Candidates next: `B` (bugbear), `I` (isort), `UP` (pyupgrade), `T20` (no print).
select = ["E", "F", "W"]
# Long lines (often inlined Chinese strings) are common; line-length
# already caps the most important cases.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=. --cov-report=term-missing --cov-report=html"
