name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 取消同分支重复跑的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend
        working-directory: backend
        run: |
          ruff check app/ --output-format=github || true
          # 当前不阻塞合并；待规范完善后改为 strict 模式
          echo "::notice::ruff completed (advisory mode)"

      - name: Syntax check
        working-directory: backend
        run: python -m compileall -q app/

  backend-smoke:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run smoke tests
        working-directory: backend
        env:
          # Smoke tests run without external services (Redis/Postgres)
          # The app must gracefully fall back to in-memory cache.
          ENV: development
          DEBUG: "true"
          SECRET_KEY: ci-test-secret-key-not-for-production-use-only
          REDIS_URL: ""
        run: pytest tests/ -v --no-header

  migration-smoke:
    name: Alembic migration smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: buddhist_text
          POSTGRES_USER: buddhist_user
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buddhist_user -d buddhist_text"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: alembic upgrade head + downgrade base
        working-directory: backend
        env:
          ENV: development
          DEBUG: "true"
          SECRET_KEY: ci-test-secret-key-not-for-production-use-only
          DATABASE_URL: postgresql+asyncpg://buddhist_user:ci-test-password@localhost:5432/buddhist_text
          REDIS_URL: ""
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend-typecheck:
    name: Frontend type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # tsc 已切回严格模式（gating）。如未来出现新的类型债，请在原 PR 中修掉，
      # 不要回退到 advisory。
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint (advisory)
        working-directory: frontend
        continue-on-error: true
        run: npm run lint --if-present

      # Gating：直接走 vite build（绕过 package.json 中的 tsc 前置），
      # 验证产物能编译出来。等类型债清理后改回 npm run build。
      - name: Build (gating)
        working-directory: frontend
        run: npx vite build

      - name: Vitest smoke tests
        working-directory: frontend
        run: npm test

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
